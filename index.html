<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿ロガー</title>

  <style>
    :root {
      --bg: #f5f7f8;
      --card: #ffffff;
      --text: #1f2933;
      --sub: #6b7280;
      --border: #d9dee3;
      --green: #0f9d58;
      --green-dark: #0b8043;
      --red: #d93025;
      --blue: #1a73e8;
      --orange: #f29900;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      padding-bottom: 88px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .meta {
      font-size: 14px;
      color: var(--sub);
      line-height: 1.7;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 6px 20px var(--shadow);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .status {
      display: none;
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .status.show {
      display: block;
    }

    .status.info {
      background: #e8f0fe;
      color: var(--blue);
    }

    .status.success {
      background: #e6f4ea;
      color: var(--green-dark);
    }

    .status.error {
      background: #fdecea;
      color: var(--red);
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 800;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: 700;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 18px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(15, 157, 88, 0.14);
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .amount-box {
      position: relative;
    }

    .yen {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--sub);
      pointer-events: none;
    }

    #amount {
      padding-left: 36px;
      font-weight: 800;
    }

    .submit {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--green);
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .loading {
      padding: 24px 0;
      text-align: center;
      color: var(--sub);
    }

    .summary-list {
      display: grid;
      gap: 12px;
    }

    .summary-item {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: #ffffff;
    }

    .summary-label {
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .summary-value {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .summary-value.food {
      color: var(--green-dark);
    }

    .summary-value.social {
      color: var(--orange);
    }

    .summary-value.cardpay {
      color: var(--blue);
    }

    .last {
      margin-top: 12px;
      font-size: 13px;
      color: var(--sub);
      line-height: 1.6;
      display: none;
    }

    .last.show {
      display: block;
    }

    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 16px;
      background: rgba(245, 247, 248, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 10;
    }

    .tab-inner {
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #e9edf2;
      padding: 5px;
      border-radius: 18px;
    }

    .tab-button {
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      color: var(--sub);
      background: transparent;
      cursor: pointer;
    }

    .tab-button.active {
      color: var(--text);
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
        padding-bottom: 88px;
      }

      h1 {
        font-size: 26px;
      }

      .card {
        padding: 16px;
        border-radius: 18px;
      }

      select,
      input,
      textarea {
        font-size: 16px;
        padding: 13px 11px;
      }

      .summary-value {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <h1>家計簿ロガー</h1>
      <div class="meta">
        <div>日付：<span id="todayText">取得中...</span></div>
        <div>入力先：<span id="sheetName">取得中...</span></div>
      </div>
    </div>

    <section id="inputScreen" class="screen active">
      <div class="card">
        <h2 class="section-title">入力</h2>

        <div id="status" class="status"></div>

        <div id="loading" class="loading">読み込み中...</div>

        <form id="form" style="display:none;">
          <label for="category">Category</label>
          <select id="category"></select>

          <label for="item">Item</label>
          <select id="item"></select>

          <label for="amount">Amount</label>
          <div class="amount-box">
            <span class="yen">¥</span>
            <input id="amount" type="number" inputmode="numeric" min="1" placeholder="金額" required>
          </div>

          <label for="memo">Memo</label>
          <textarea id="memo" placeholder="メモ。空欄でもOK"></textarea>

          <button id="submitButton" class="submit" type="submit">保存する</button>
        </form>

        <div id="last" class="last"></div>
      </div>
    </section>

    <section id="summaryScreen" class="screen">
      <div class="card">
        <h2 class="section-title">変動費</h2>

        <div class="summary-list">
          <div class="summary-item">
            <div class="summary-label">食費</div>
            <div id="foodTotal" class="summary-value food">¥0</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">交際費</div>
            <div id="socialTotal" class="summary-value social">¥0</div>
          </div>

          <div class="summary-item">
            <div class="summary-label">カードの支払い</div>
            <div id="cardTotal" class="summary-value cardpay">¥0</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <nav class="tabs">
    <div class="tab-inner">
      <button id="inputTab" class="tab-button active" type="button" onclick="switchScreen('input')">入力</button>
      <button id="summaryTab" class="tab-button" type="button" onclick="switchScreen('summary')">集計</button>
    </div>
  </nav>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxGe9RSpDwmY_crff6OGwvI4AxSQIxD7Abl7t7HBFLHhFI1bqTTPZLZD58Ab_Yu4cQ/exec';

    const todayTextEl = document.getElementById('todayText');
    const sheetNameEl = document.getElementById('sheetName');
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const formEl = document.getElementById('form');
    const categoryEl = document.getElementById('category');
    const itemEl = document.getElementById('item');
    const amountEl = document.getElementById('amount');
    const memoEl = document.getElementById('memo');
    const submitButton = document.getElementById('submitButton');
    const lastEl = document.getElementById('last');

    const foodTotalEl = document.getElementById('foodTotal');
    const socialTotalEl = document.getElementById('socialTotal');
    const cardTotalEl = document.getElementById('cardTotal');

    const inputScreenEl = document.getElementById('inputScreen');
    const summaryScreenEl = document.getElementById('summaryScreen');
    const inputTabEl = document.getElementById('inputTab');
    const summaryTabEl = document.getElementById('summaryTab');

    window.addEventListener('load', function () {
      showStatus('初期データを読み込んでいます...', 'info');

      callApi('init')
        .then(function (data) {
          handleInitialData(data);
        })
        .catch(function (error) {
          handleError(error);
        });
    });

    function switchScreen(screenName) {
      if (screenName === 'summary') {
        inputScreenEl.classList.remove('active');
        summaryScreenEl.classList.add('active');
        inputTabEl.classList.remove('active');
        summaryTabEl.classList.add('active');

        callApi('summary')
          .then(function (data) {
            updateSummary(data.summary || { food: 0, social: 0, card: 0 });
          })
          .catch(function () {});
      } else {
        summaryScreenEl.classList.remove('active');
        inputScreenEl.classList.add('active');
        summaryTabEl.classList.remove('active');
        inputTabEl.classList.add('active');
      }
    }

    function callApi(action, params) {
      params = params || {};

      return new Promise(function (resolve, reject) {
        const callbackName =
          'jsonpCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);

        let finished = false;

        window[callbackName] = function (data) {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();

          if (!data || data.success === false) {
            reject(new Error(data && data.message ? data.message : 'APIエラーが発生しました。'));
            return;
          }

          resolve(data);
        };

        const query = [];
        query.push('action=' + encodeURIComponent(action));
        query.push('callback=' + encodeURIComponent(callbackName));

        Object.keys(params).forEach(function (key) {
          query.push(encodeURIComponent(key) + '=' + encodeURIComponent(params[key]));
        });

        const script = document.createElement('script');
        script.src = API_URL + '?' + query.join('&');

        script.onerror = function () {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();
          reject(new Error('APIに接続できませんでした。Apps ScriptのURLや公開設定を確認してください。'));
        };

        document.body.appendChild(script);

        setTimeout(function () {
          if (finished) {
            return;
          }

          finished = true;
          cleanup();
          reject(new Error('読み込みがタイムアウトしました。'));
        }, 15000);

        function cleanup() {
          delete window[callbackName];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }
      });
    }

    function handleInitialData(data) {
      todayTextEl.textContent = data.todayText || '';
      sheetNameEl.textContent = data.sheetName || '';

      setOptions(categoryEl, data.categories || []);
      setOptions(itemEl, data.items || []);

      updateSummary(data.summary || { food: 0, social: 0, card: 0 });

      loadingEl.style.display = 'none';
      formEl.style.display = 'block';
      hideStatus();
    }

    function setOptions(selectEl, options) {
      selectEl.innerHTML = '';

      if (!options.length) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = '選択肢なし';
        selectEl.appendChild(option);
        return;
      }

      options.forEach(function (value) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        selectEl.appendChild(option);
      });
    }

    formEl.addEventListener('submit', function (event) {
      event.preventDefault();

      const category = categoryEl.value;
      const item = itemEl.value;
      const amount = amountEl.value;
      const memo = memoEl.value;

      if (!item) {
        showStatus('Itemを選択してください。', 'error');
        return;
      }

      if (!amount || Number(amount) <= 0) {
        showStatus('金額を入力してください。', 'error');
        amountEl.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = '保存中...';
      showStatus('保存しています...', 'info');

      callApi('add', {
        category: category,
        item: item,
        amount: amount,
        memo: memo
      })
        .then(function (result) {
          handleSaved(result);
        })
        .catch(function (error) {
          handleError(error);
        });
    });

    function handleSaved(result) {
      showStatus('保存しました。', 'success');

      vibrateSuccess();

      const saved = result.saved || {};

      lastEl.className = 'last show';
      lastEl.innerHTML =
        '最後の保存：' + result.sheetName + ' / ' + result.row + '行目<br>' +
        (saved.date || '') + '　' +
        (saved.category || 'カード払い') + '　' +
        (saved.item || '') + '　' +
        '¥' + Number(saved.amount || 0).toLocaleString() + '　' +
        (saved.memo || '');

      updateSummary(result.summary || { food: 0, social: 0, card: 0 });

      amountEl.value = '';
      memoEl.value = '';

      submitButton.disabled = false;
      submitButton.textContent = '保存する';
    }

    function updateSummary(summary) {
      foodTotalEl.textContent = formatYen(summary.food || 0);
      socialTotalEl.textContent = formatYen(summary.social || 0);
      cardTotalEl.textContent = formatYen(summary.card || 0);
    }

    function formatYen(value) {
      return '¥' + Number(value || 0).toLocaleString();
    }

    function vibrateSuccess() {
      if (navigator.vibrate) {
        navigator.vibrate(80);
      }
    }

    function showStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status show ' + type;
    }

    function hideStatus() {
      statusEl.textContent = '';
      statusEl.className = 'status';
    }

    function handleError(error) {
      loadingEl.style.display = 'none';
      showStatus(error.message || String(error), 'error');
      submitButton.disabled = false;
      submitButton.textContent = '保存する';
    }
  </script>
</body>
</html>
